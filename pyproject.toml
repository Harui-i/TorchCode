[project]
name = "torch-learn"
version = "0.1.0"
description = "PyTorch exercises with a local Python CLI judge"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.8,<3",
    "numpy>=2,<3",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
